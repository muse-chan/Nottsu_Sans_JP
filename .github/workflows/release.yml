name: Release fonts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.0
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: font-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != branch ]]; then
            echo '::error::Run this workflow from a branch so it can update the preview images.'
            exit 1
          fi
          version="${VERSION#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Enter a release version such as 1.0.0 or v1.0.0.'
            exit 1
          fi
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Build fonts
        run: |
          npm ci
          npm run build

      - name: Verify fonts
        run: |
          npm test
          tool="$RUNNER_TEMP/ots-9.3.0-Linux.zip"
          curl -fsSL https://github.com/khaledhosny/ots/releases/download/v9.3.0/ots-9.3.0-Linux.zip -o "$tool"
          printf '%s  %s\n' '1caab4037806688203efd124b97443694794ca69a3dddd9a42b4833a4f8c4967' "$tool" | sha256sum -c -
          unzip -q "$tool" -d "$RUNNER_TEMP"
          ots="$RUNNER_TEMP/ots-9.3.0-Linux/ots-sanitize"
          chmod +x "$ots"
          for font in dist/*.ttf dist/static/*.ttf; do
            "$ots" "$font" "$RUNNER_TEMP/sanitized.ttf"
          done

      - name: Package fonts
        id: package
        working-directory: dist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          archive="$RUNNER_TEMP/NottsuSansJP-$TAG.zip"
          zip -q -r "$archive" .
          unzip -tq "$archive"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Commit preview images
        id: previews
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add -- 0-color.png 0-color-{title,characters,28,22,18}.png
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Update font preview images'
          fi
          commit=$(git rev-parse HEAD)
          if existing_commit=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}") && [[ "$existing_commit" != "$commit" ]]; then
            echo '::error::The release tag points to a different commit.'
            exit 1
          fi
          if [[ "$commit" != "$GITHUB_SHA" ]]; then
            git push origin "HEAD:$GITHUB_REF"
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          TARGET_COMMIT: ${{ steps.previews.outputs.commit }}
        run: |
          gh release create "$TAG" "$ARCHIVE" \
            --target "$TARGET_COMMIT" \
            --title "Nottsu Sans JP $TAG" \
            --generate-notes
